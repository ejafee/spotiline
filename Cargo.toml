[package]
name = "spotiline"
version = "1.2.0"
edition = "2021"
authors = ["Muhammad Faeyza Ashira"]
license = "MIT"
description = "Headless Spotify client for terminal users and AI agents"
repository = "https://github.com/ejafee/spotiline"
keywords = ["spotify", "cli", "tui", "terminal"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
ratatui = "0.30"
crossterm = "0.28"
rspotify = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"
keyring = "3.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1.0"
tokio-serde = { version = "0.9", features = ["bincode"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
dirs = "5.0"
chrono = "0.4"
open = "5.0"
